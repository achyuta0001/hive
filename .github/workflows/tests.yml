name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Offline suites only — no network, no API keys, no LLM calls.
      - run: python tests/test_precheck.py
      - run: python tests/test_permissions.py
      - run: python tests/test_confluence.py
      - run: python tests/test_stats.py
      - run: python tests/test_clustering.py
      - run: python tests/test_hash_diff.py
      - run: python tests/test_notion.py
      - run: python tests/test_server.py
